<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="קורס בינה מלאכותית לאדריכלים - אפליקציה אחודה להנחיית קורס">
  <title>קורס בינה מלאכותית לאדריכלים</title>

  <!-- Design System & Components -->
  <link rel="stylesheet" href="./design-system.css">
  <link rel="stylesheet" href="./components.css">

  <style>
    /* Inline critical styles for faster paint */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    .app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      .app {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="app" id="app"></div>

<!-- Import data and logic as modules -->
<script type="module">
  import { lessons } from './data.js';

  // Expose lessons globally for debugging
  window.lessons = lessons;

  // Dynamic import of index.js
  import('./index.js');
</script>

</body>
</html>
